name: gamelog
description: "A Game Logging app"
publish_to: 'none'

version: 1.1.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- STORAGE & UTILS ---
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^2.0.1
  share_plus: ^10.1.4
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # --- DATABASE (HIVE) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # --- NETWORK & IMAGES (PREMIUM FEATURES) ---
  http: ^1.2.0
  cached_network_image: ^3.3.1

  # --- STATE MANAGEMENT (RIVERPOD STABLE) ---
  flutter_riverpod: ^2.6.1
  # We use 2.4.0 specifically to avoid conflicts with flutter_riverpod
  riverpod_annotation: ^2.4.0

  # --- ICONS ---
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- CODE GENERATION ---
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  # We use 2.4.0 to match the annotation version above
  riverpod_generator: ^2.4.0

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0

# --- APP CONFIGURATION ---
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

# --- ICON CONFIGURATION ---
flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon.png"
    remove_alpha_ios: true
